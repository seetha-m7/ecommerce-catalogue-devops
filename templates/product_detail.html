
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} | Curio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
            color: #222;
        }

        .card {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
        }

        .price {
            color: #15803d;
            font-size: 26px;
            font-weight: bold;
        }

        a {
            color: #172554;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{ product.name }}</h1>

        {% if product.image %}
            <img src="{{ product.image }}"
                 alt="{{ product.name }}"
                 style="max-width: 100%;">
        {% endif %}

        <p class="price">
            ₹{{ "%.2f"|format(product.price|float) }}
        </p>

        <p>{{ product.description }}</p>
        <p><strong>Category:</strong> {{ product.category }}</p>

        <a href="{{ url_for('home') }}">← Back to catalogue</a>
    </div>
</body>
</html>
